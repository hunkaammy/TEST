<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hindustan Toys | Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5; --bg: #ffffff; --sidebar-bg: #f3f4f6;
            --text: #111827; --danger: #ef4444; --radius: 12px;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* --- HEADER --- */
        #top-bar { background: white; padding: 12px 16px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { border: none; background: #f3f4f6; padding: 8px 12px; border-radius: 8px; cursor: pointer; display: none; }
        .breadcrumb { font-weight: 800; font-size: 16px; }

        /* --- LAYOUT: SPLIT SCREEN --- */
        #shop-container { display: flex; flex: 1; overflow: hidden; }

        /* Left Side: Vertical Tabs */
        #vertical-tabs {
            width: 90px; background: var(--sidebar-bg); overflow-y: auto;
            border-right: 1px solid #e5e7eb; flex-shrink: 0;
        }
        .tab-item {
            padding: 15px 8px; text-align: center; font-size: 11px; font-weight: 600;
            cursor: pointer; border-bottom: 1px solid #e5e7eb; transition: 0.2s;
        }
        .tab-item img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 6px; background: #ddd; }
        .tab-item.active { background: white; color: var(--primary); border-left: 4px solid var(--primary); }

        /* Right Side: Content Area */
        #content-area { flex: 1; overflow-y: auto; padding: 12px; }

        /* Subcategory 2-Column Grid */
        .sub-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .sub-card { background: #fff; border: 1px solid #f3f4f6; border-radius: var(--radius); padding: 8px; text-align: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .sub-card img { width: 100%; aspect-ratio: 1/1; border-radius: 8px; object-fit: cover; margin-bottom: 8px; }
        .sub-card span { font-size: 12px; font-weight: 700; color: #374151; }

        /* Product Display (Full Width) */
        .prod-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .prod-card { border-radius: var(--radius); overflow: hidden; border: 1px solid #eee; position: relative; }
        .prod-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .prod-info { padding: 10px; text-align: center; }
        .price { color: var(--danger); font-weight: 800; font-size: 16px; }
        .add-btn { width: 100%; border: none; padding: 8px; background: var(--primary); color: white; border-radius: 6px; font-weight: 700; margin-top: 5px; cursor: pointer; }

        /* Cart Bar */
        #cart-bar { position: fixed; bottom: 15px; left: 15px; right: 15px; background: #000; color: white; padding: 15px; border-radius: 15px; display: none; justify-content: space-between; align-items: center; box-shadow: 0 10px 20px rgba(0,0,0,0.3); z-index: 1000; }
        .wa-btn { background: #10b981; border: none; padding: 8px 16px; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div id="top-bar">
    <button id="backBtn" class="back-btn" onclick="goBack()">← Back</button>
    <span id="breadcrumb" class="breadcrumb">Hindustan Toys</span>
    <div style="width:40px"></div> </div>

<div id="shop-container">
    <div id="vertical-tabs"></div>

    <div id="content-area">
        <div id="mainDisplay"></div>
    </div>
</div>

<div id="cart-bar">
    <div id="cart-info">0 Items | ₹0</div>
    <button class="wa-btn" onclick="sendOrder()">Order on WhatsApp</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDb5ed1NlcTJs2vR4D4plKfp-dnl49PVpk",
        authDomain: "ashok-book-depo.firebaseapp.com",
        databaseURL: "https://ashok-book-depo-default-rtdb.firebaseio.com",
        projectId: "ashok-book-depo",
        storageBucket: "ashok-book-depo.firebasestorage.app",
        messagingSenderId: "535504138867",
        appId: "1:535504138867:web:9edcd28cc9a580cd4b3006"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let dataCache = { categories: {}, products: {} };
    let currentView = 'EXPLORE'; // EXPLORE (Subcats) or PRODUCTS
    let selectedCatID = "";
    let selectedSubID = "";
    let cart = [];

    // --- NAVIGATION ---
    window.selectCategory = (id) => {
        selectedCatID = id;
        currentView = 'EXPLORE';
        renderTabs();
        renderContent();
    };

    window.selectSub = (id) => {
        selectedSubID = id;
        currentView = 'PRODUCTS';
        renderContent();
    };

    window.goBack = () => {
        if(currentView === 'PRODUCTS') currentView = 'EXPLORE';
        renderContent();
    };

    // --- RENDERING ---
    function renderTabs() {
        const tabBox = document.getElementById('vertical-tabs');
        tabBox.innerHTML = '';
        Object.values(dataCache.categories).forEach(cat => {
            const div = document.createElement('div');
            div.className = `tab-item ${selectedCatID === cat.id ? 'active' : ''}`;
            div.onclick = () => selectCategory(cat.id);
            div.innerHTML = `<img src="${cat.imgUrl}"><span>${cat.name}</span>`;
            tabBox.appendChild(div);
        });
    }

    function renderContent() {
        const display = document.getElementById('mainDisplay');
        const backBtn = document.getElementById('backBtn');
        const breadcrumb = document.getElementById('breadcrumb');
        display.innerHTML = '';

        if (currentView === 'EXPLORE') {
            backBtn.style.display = 'none';
            breadcrumb.innerText = dataCache.categories[selectedCatID]?.name || "Catalog";
            
            const grid = document.createElement('div');
            grid.className = 'sub-grid';
            
            const subs = dataCache.categories[selectedCatID]?.subcategories || {};
            Object.values(subs).forEach(sub => {
                grid.innerHTML += `
                    <div class="sub-card" onclick="selectSub('${sub.id}')">
                        <img src="${sub.imgUrl}">
                        <span>${sub.name}</span>
                    </div>`;
            });
            display.appendChild(grid);
        } 
        else if (currentView === 'PRODUCTS') {
            backBtn.style.display = 'block';
            breadcrumb.innerText = dataCache.categories[selectedCatID].subcategories[selectedSubID].name;

            const grid = document.createElement('div');
            grid.className = 'prod-grid';
            
            const prods = Object.values(dataCache.products).filter(p => p.catId === selectedCatID && p.subId === selectedSubID);
            prods.forEach(p => {
                grid.innerHTML += `
                    <div class="prod-card">
                        <img src="${p.imgUrl}">
                        <div class="prod-info">
                            <div style="font-size:12px; font-weight:600">${p.name}</div>
                            <div class="price">₹${p.price}</div>
                            <button class="add-btn" onclick="addToCart('${p.name}', ${p.price})">Add +</button>
                        </div>
                    </div>`;
            });
            display.appendChild(grid);
        }
    }

    // --- CART ---
    window.addToCart = (name, price) => {
        cart.push({name, price});
        const bar = document.getElementById('cart-bar');
        bar.style.display = 'flex';
        const total = cart.reduce((s, i) => s + i.price, 0);
        document.getElementById('cart-info').innerText = `${cart.length} Items | ₹${total}`;
    };

    window.sendOrder = () => {
        const msg = cart.map(i => `${i.name} (₹${i.price})`).join('%0A');
        const total = cart.reduce((s, i) => s + i.price, 0);
        window.open(`https://wa.me/91XXXXXXXXXX?text=*Order Details:*%0A${msg}%0A%0A*Total: ₹${total}*`, '_blank');
    };

    // --- DATA SYNC ---
    onValue(ref(db, 'categories'), (snap) => {
        dataCache.categories = snap.val() || {};
        if(!selectedCatID && Object.keys(dataCache.categories).length > 0) {
            selectedCatID = Object.keys(dataCache.categories)[0];
        }
        renderTabs();
        renderContent();
    });

    onValue(ref(db, 'products'), (snap) => {
        dataCache.products = snap.val() || {};
        renderContent();
    });
</script>
</body>
</html>
